# fail2ban jail for failed FOR-IDENT logins (SP-17): 10 failures within 10 minutes block the address for one hour
# on ports 80/443. Install: /etc/fail2ban/jail.d/for-ident.conf, then systemctl reload fail2ban
#
# Caddy runs in Docker: published ports bypass the INPUT chain, so the ban acts on DOCKER-USER (iptables-allports
# with chain=DOCKER-USER). With Caddy on the host use the default action instead (remove the action line).
#
# journalflags=1 (LOCAL_ONLY instead of the default SYSTEM_ONLY, SP-20): the service runs as forident, and journald
# stores the output of a service with its own user in that user's journal file (user-<uid>.journal). With the default
# flags fail2ban does not read that file and never sees a failed login.
[for-ident]
enabled  = true
backend  = systemd[journalflags=1]
journalmatch = _SYSTEMD_UNIT=for-ident.service
filter   = for-ident
maxretry = 10
findtime = 10m
bantime  = 1h
action   = iptables-allports[name=for-ident, chain=DOCKER-USER]
