# fail2ban filter for failed FOR-IDENT logins (SP-17), log line of LoginFailureLogger as fail2ban reads it from the journal:
#   srv java[1234]: 2026-11-10T19:10:33.213+01:00  WARN 1234 --- [io-8080-exec-1] d.h.f.u.f.security.LoginFailureLogger    : Login failed from 203.0.113.7
# Install: /etc/fail2ban/filter.d/for-ident.conf, together with jail.d-for-ident.conf (see deploy/README.md)
#
# Anchored on the whole line (SP-20, review finding S1): timestamp, level WARN, process id and the logger name must
# come first, so text inside the message of another log line cannot imitate a failed login.
# Check: fail2ban-regex -m "_SYSTEMD_UNIT=for-ident.service" "systemd-journal[journalflags=1]" /etc/fail2ban/filter.d/for-ident.conf
[INCLUDES]
before = common.conf

[Definition]
failregex = ^%(__prefix_line)s\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d(?:\.\d+)?(?:Z|[+-]\d\d:?\d\d)?\s+WARN \d+ --- (?:\[[^\]]*\] ?)+\S*LoginFailureLogger\s*: Login failed from <HOST>$
ignoreregex =
