# fail2ban filter for failed FOR-IDENT logins (SP-17), log line of LoginFailureLogger:
#   ... WARN ... d.h.f.u.f.security.LoginFailureLogger : Login failed from 203.0.113.7
# Install: /etc/fail2ban/filter.d/for-ident.conf, together with jail.d-for-ident.conf (see deploy/README.md)
[Definition]
failregex = LoginFailureLogger\s*: Login failed from <HOST>$
ignoreregex =
