// Version 3.0: Java 21, Spring Boot 4.1, Vaadin Flow 25 (SP-10 to SP-17). Release builds set BUILD_NUMBER, e.g. 0 -> 3.0.0
project.ext.projectVersion = new ProjectVersion(3,0,System.env.BUILD_NUMBER)

class ProjectVersion {
	Integer major
	Integer minor
	String build 
	
	ProjectVersion (Integer major, Integer minor, String build) {
		this.major = major
		this.minor = minor
		this.build = build
	}
	
	@Override
	String toString() {
		String fullVersion = "$major.$minor"
		if(build) {
			fullVersion += ".$build"
		} else {
			fullVersion += ".SNAPSHOT";
		}
		fullVersion
	}
}