plugins {
	alias(libs.plugins.spring.boot)
	alias(libs.plugins.asciidoctor)
	// Builds the frontend bundle of the Vaadin Flow UI into the JAR (production mode; downloads Node.js if needed)
	alias(libs.plugins.vaadin)
}

group = "de.hswt.fi"

def profiles = 'development'

// Gradle shortens the too long Windows command line itself (formerly the pathingJar task)
bootRun {
	args = ["--spring.profiles.active=" + profiles]
}

bootJar {
	archiveClassifier = 'boot'
	archiveFileName = 'de.hswt.fi.application.jar'
	// No layer index and layertools JAR (new in the Spring Boot 2.7 plugin), as in the JAR built so far
	layered {
		enabled = false
	}
	manifest {
		attributes("Implementation-Version": project.projectVersion)
	}
}

