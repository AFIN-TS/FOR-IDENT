test {
	systemProperty 'spring.profiles.active', 'test'
}

// Regression tests (SP-03): compare import, processing, export and REST API results with golden files.
// They need the local databases (see dev/README.md) and are therefore not part of "build";
// run them with dev/run-regression.ps1. -Dregression.update=true rewrites the golden files.
sourceSets {
	regressionTest {
		// Sources and resources by convention in src/regressionTest/java and src/regressionTest/resources
		// Not the output of src/test: its TestApplicationContext clears the user database on startup
		compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
		runtimeClasspath += output + compileClasspath
	}
}

task regressionTest(type: Test) {
	description = 'Runs the regression tests against the local databases (see dev/README.md).'
	group = 'verification'
	testClassesDirs = sourceSets.regressionTest.output.classesDirs
	classpath = sourceSets.regressionTest.runtimeClasspath
	systemProperty 'regression.rootDir', rootProject.projectDir
	// Own directory for the session temporary files, so the tests do not touch a running local application
	systemProperty 'de.hswt.fi.session-temp-directory', file("${layout.buildDirectory.get().asFile}/regression/sessions")
	systemProperty 'regression.goldenDir', file('src/regressionTest/resources/golden')
	systemProperty 'regression.actualDir', file("${layout.buildDirectory.get().asFile}/regression/actual")
	systemProperty 'regression.update', System.getProperty('regression.update', 'false')
	systemProperty 'regression.productionUrl', System.getProperty('regression.productionUrl', '')
	systemProperty 'regression.exportRepeat', System.getProperty('regression.exportRepeat', '3')
	// The Vaadin UI starts in production mode as in the JAR (the tests do not use it; vaadin-dev is not on the classpath)
	systemProperty 'vaadin.productionMode', 'true'
	outputs.upToDateWhen { false }
	testLogging {
		events 'passed', 'failed'
		exceptionFormat = 'full'
	}
	maxHeapSize = '3G'
}


// API overview (src/docs/asciidoc/api.adoc): gradlew :application:asciidoctor writes build/docs/asciidoc/api.html.
// The complete description is generated from the code at runtime: /api/openapi and the Swagger UI /api/docs (SP-14);
// the REST Docs tests that were meant to produce request/response snippets (never active) were removed.

// The JAR always contains the production frontend bundle (SP-11); the development mode (vaadin-dev) is only on the
// bootRun classpath
vaadin {
	productionMode = true
}
