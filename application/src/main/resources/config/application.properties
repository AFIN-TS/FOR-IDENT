# Default Settings for all Profiles, can be overriden
# Should ot contain a DataSource Configuration
spring.mail.host=${FI_MAIL_HOST:}
spring.mail.port=${FI_MAIL_PORT:25}
# SMTP login of a mailbox (SP-16, topic T5): port 587 with STARTTLS or port 465 with SSL; empty = no login
spring.mail.username=${FI_MAIL_USERNAME:}
spring.mail.password=${FI_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${FI_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${FI_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${FI_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${FI_MAIL_SSL:false}
# A mail server that does not answer must not block registrations (milliseconds)
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

de.hswt.fi.contact-adresses=${FI_CONTACT_ADDRESSES:}
de.hswt.fi.from-email-address=${FI_FROM_EMAIL_ADDRESS:}
# Public address of the site, e.g. https://for-ident.example.org (SP-20): links in mails (password reset) are built from it,
# never from the Host header of the request. Empty: the address of the request is used (local development only).
de.hswt.fi.public-url=${FI_PUBLIC_URL:}

de.hswt.fi.security.redirect-url=/
de.hswt.fi.security.logout-url=/logout
de.hswt.fi.security.password-length=10
de.hswt.fi.security.registration-enabled=true

de.hswt.fi.ui.header.caption=FOR-IDENT
de.hswt.fi.ui.header.collapsed-caption=FI
de.hswt.fi.ui.header.visible=false
de.hswt.fi.ui.title=FOR-IDENT
de.hswt.fi.ui.header.logo=img/logo.png
# External links of the details (SP-14). {value} is replaced by the URL-encoded value.
# ECHA CHEM replaced the old REACH dissemination pages; the search takes the CAS number
de.hswt.fi.ui.links.reach=https://chem.echa.europa.eu/
de.hswt.fi.ui.links.reach-parameterized=https://chem.echa.europa.eu/substance-search?searchText={value}
# MassBank 3 needs other record IDs, see topic T12 (the old links return 404)
de.hswt.fi.ui.links.massbank-parameterized=https://massbank.eu/MassBank/RecordDisplay.jsp?id={value}
# PubChem compound page by InChIKey
de.hswt.fi.ui.links.pubchem-parameterized=https://pubchem.ncbi.nlm.nih.gov/compound/{value}

# CompTox Chemicals Dashboard, followed by the DTXSID
de.hswt.fi.ui.links.epa=https://comptox.epa.gov/dashboard/chemical/details/

server.forward-headers-strategy=native

# Uploaded files are kept only during the session, in a directory below this root (emptied on startup).
# The session ends on logout or, after the browser window was closed, when the session times out;
# the Vaadin heartbeat (seconds) keeps the session of an open window alive.
de.hswt.fi.session-temp-directory=${FI_SESSION_TEMP_DIRECTORY:${java.io.tmpdir}/fi-sessions-${server.port:8080}}
server.servlet.session.timeout=${FI_SESSION_TIMEOUT:5m}
# Session ID only in the cookie, never in URLs (";jsessionid=" could end up in logs or Referer headers), and
# SameSite=Lax as additional protection besides the CSRF tokens of Vaadin (SP-17 security review)
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=lax
vaadin.servlet.heartbeatInterval=60

# Transformation products (MongoDB pathway database), switched off by default
spring.datasource.pathway.enabled=${FI_PATHWAY_ENABLED:false}
# The pathway database has its own MongoDB client (PathwayDatabaseConfiguration, only when enabled); the default
# client of Spring Boot would otherwise connect to localhost:27017 (SP-16)
spring.autoconfigure.exclude=org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration,org.springframework.boot.mongodb.autoconfigure.MongoReactiveAutoConfiguration
spring.datasource.pathway.host=${FI_DB_PATHWAY_HOST:localhost}
spring.datasource.pathway.port=${FI_DB_PATHWAY_PORT:27017}
spring.datasource.pathway.database=${FI_DB_PATHWAY_DATABASE:pathwaydb}
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

spring.web.resources.static-locations=file:///${user.home}/html
html-home-english=home_en.html
html-home-german=home_de.html
html-help-processing-english=processing_help_en.html
html-help-processing-german=processing_help_de.html
# REST API JSON: properties in declaration order as with Jackson 2 / Spring Boot 2.7 (Jackson 3 sorts them
# alphabetically by default; SP-10)
spring.jackson.mapper.sort-properties-alphabetically=false

# Description of the REST API (SP-14): OpenAPI document and Swagger UI, generated from the controllers
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api/docs
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.try-it-out-enabled=true
# Pages of the REST API keep their JSON structure of all earlier versions (PageImpl as is); set explicitly, which
# also ends the Spring Data warning about it
spring.data.web.pageable.serialization-mode=direct
# Default page size of the REST API (also set in RestControllerConfiguration); the API description shows it
spring.data.web.pageable.default-page-size=100

# Health checks (SP-16): only /actuator/health with liveness and readiness, without details for visitors.
# The databases are checked; the mail server is not (that would open an SMTP connection on every check)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
