# Settings specific for the "production" profile
# Overrides default values
logging.file.name=${user.home}/.config/de.hswt.fi/logs/fi-lc-production.log

vaadin.servlet.productionMode=true

de.hswt.fi.ui.header.caption=FOR-IDENT LC

spring.datasource.user.driverClassName=org.postgresql.Driver
spring.datasource.user.url=${FI_DB_USER_URL:jdbc:postgresql://localhost:5432/fi-lc-users}
spring.datasource.user.username=${FI_DB_USER_USERNAME:forident}
spring.datasource.user.password=${FI_DB_USER_PASSWORD:}
spring.datasource.user.test-on-borrow=true
spring.datasource.user.validation-query=SELECT 1

spring.datasource.stoffident.driverClassName=org.postgresql.Driver
spring.datasource.stoffident.url=${FI_DB_STOFFIDENT_URL:jdbc:postgresql://localhost:5432/fi-lc-stoffident}
spring.datasource.stoffident.username=${FI_DB_STOFFIDENT_USERNAME:forident}
spring.datasource.stoffident.password=${FI_DB_STOFFIDENT_PASSWORD:}
spring.datasource.stoffident.test-on-borrow=true
spring.datasource.stoffident.validation-query=SELECT 1

spring.datasource.plantident.driverClassName=org.postgresql.Driver
spring.datasource.plantident.url=${FI_DB_PLANTIDENT_URL:jdbc:postgresql://localhost:5432/fi-lc-plantident}
spring.datasource.plantident.username=${FI_DB_PLANTIDENT_USERNAME:forident}
spring.datasource.plantident.password=${FI_DB_PLANTIDENT_PASSWORD:}
spring.datasource.plantident.test-on-borrow=true
spring.datasource.plantident.validation-query=SELECT 1

