# Settings specific for the "test" profile
# Overrides default values
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.user.driverClassName=org.h2.Driver
spring.datasource.user.url=jdbc:h2:mem:tu;NON_KEYWORDS=VALUE
spring.datasource.user.username=sa
spring.datasource.user.password=
#Custom property generate-ddl, as default is not picked up by spring with multiple data sources
spring.datasource.user.generate-ddl=true

spring.datasource.stoffident.driverClassName=org.h2.Driver
# H2 2.x reserves VALUE as keyword; the compound tables have a column "value" (allowed in PostgreSQL)
spring.datasource.stoffident.url=jdbc:h2:mem:ts;NON_KEYWORDS=VALUE
spring.datasource.stoffident.username=sa
spring.datasource.stoffident.password=
#Custom property generate-ddl, as default is not picked up by spring with multiple data sources
spring.datasource.stoffident.generate-ddl=true
# Own directory for the session temporary files, so tests do not touch a running application
de.hswt.fi.session-temp-directory=${java.io.tmpdir}/fi-sessions-test

# In-memory H2 databases: EclipseLink generates the tables, no Flyway migrations (SP-16)
de.hswt.fi.flyway.enabled=false
