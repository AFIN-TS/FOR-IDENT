# Settings specific for the "production" profile
# Overrides default values
logging.file.name=${user.home}/.config/de.hswt.fi/logs/fi-production.log

vaadin.servlet.productionMode=true
spring.mail.host=${FI_MAIL_HOST:localhost}

de.hswt.fi.ui.header.caption=FOR-IDENT GC

spring.datasource.user.driverClassName=org.postgresql.Driver
spring.datasource.user.url=${FI_DB_USER_URL:jdbc:postgresql://localhost/fi2-duftuser}
spring.datasource.user.username=${FI_DB_USER_USERNAME:postgres}
spring.datasource.user.password=${FI_DB_USER_PASSWORD:}
spring.datasource.user.test-on-borrow=true
spring.datasource.user.validation-query=SELECT 1

spring.datasource.duftstoffident.driverClassName=org.postgresql.Driver
spring.datasource.duftstoffident.url=${FI_DB_DUFTSTOFFIDENT_URL:jdbc:postgresql://localhost/fi2-duftstoffident}
spring.datasource.duftstoffident.username=${FI_DB_DUFTSTOFFIDENT_USERNAME:postgres}
spring.datasource.duftstoffident.password=${FI_DB_DUFTSTOFFIDENT_PASSWORD:}
spring.datasource.duftstoffident.test-on-borrow=true
spring.datasource.duftstoffident.validation-query=SELECT 1

# The tables are created and updated by the Flyway migrations (SP-16, db/migration), not by EclipseLink
