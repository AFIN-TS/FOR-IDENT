plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
    alias(libs.plugins.asciidoctor) apply false
    alias(libs.plugins.dependency.check)
    alias(libs.plugins.vaadin) apply false
}

// Dependency scan (SP-04): gradlew dependencyCheckAggregate writes build/reports/dependency-check-report.html.
// An NVD API key (https://nvd.nist.gov/developers/request-an-api-key) in NVD_API_KEY speeds up the first download.
dependencyCheck {
    formats = ["HTML", "JSON"]
    scanConfigurations = ["runtimeClasspath"]
    // Documented false positives
    suppressionFile = "$rootDir/gradle/dependency-check-suppressions.xml"
    nvd {
        apiKey = System.getenv("NVD_API_KEY") ?: ""
    }
    analyzers {
        // OSS Index needs an account since 2025; the NVD data is used instead
        ossIndex {
            enabled = false
        }
        assemblyEnabled = false
        nodeEnabled = false
        nodeAudit {
            enabled = false
        }
        retirejs {
            enabled = false
        }
    }
}

subprojects {

    apply plugin: "java-library"

    apply from: "$rootDir/gradle/versioning.gradle"
    version = project.projectVersion
    // The UI shows the Implementation-Version of its own module JAR (SideBar, admins only)
    tasks.named("jar") {
        manifest {
            attributes("Implementation-Title": project.name, "Implementation-Version": project.projectVersion)
        }
    }

    // Compiling, tests and bootRun use Java 21 (SP-10; found automatically, independent of the JDK running Gradle)
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        // Parameter names in the class files: Spring 6.1+ needs them for @RequestParam/@PathVariable without an explicit
        // name (SP-10); the Spring Boot plugin only sets this for the application module
        options.compilerArgs << "-parameters"
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    apply plugin: "idea"

    idea {
        module {
            inheritOutputDirs = true
        }
    }

    repositories {
        mavenCentral()
        // jmzml and its psidev dependencies (the old ~maven/m2repo serves POMs but no longer the JARs)
        maven { url = "https://www.ebi.ac.uk/Tools/maven/repos/content/groups/ebi-repo/" }
        // repo.spring.io/repo and /plugins-release no longer serve artifacts anonymously (HTTP 405)
        flatDir {
            dirs "$rootProject.projectDir/libraries/metfrag"
        }
    }

    // Newer versions than in the Spring Boot BOM (security fixes, see libs.versions.toml)
    ext["mongodb.version"] = libs.versions.mongodb.get()

    // Manage transitive dependencies
    apply plugin: "io.spring.dependency-management"

    dependencyManagement {

        imports {
            mavenBom libs.spring.boot.dependencies.get().toString()
            mavenBom libs.vaadin.bom.get().toString()
        }

        dependencies {

            //Syntactic Sugar
            dependencySet(group: "org.springframework.boot", version: libs.versions.spring.boot.get()) {
                entry "spring-boot-starter"
                entry "spring-boot-starter-web"
                entry "spring-boot-starter-logging"
                entry "spring-boot-starter-mail"
                entry "spring-boot-starter-freemarker"
                entry "spring-boot-starter-security"
                entry "spring-boot-starter-validation"
                entry "spring-boot-starter-data-mongodb"
                entry("spring-boot-starter-data-jpa")
            }

            dependency(libs.cdk.bundle.get().toString()) {
                // Not needed. (cdk-legacy, excluded before as "strict GPL", is LGPL 2.1 like all of CDK 2.11 and
                // is needed by MetFragLib 2.6.11: SMARTSQueryTool of the neutral loss fragmenter)
                exclude "org.openscience.cdk:cdk-qsaratomic"
            }

            // Common
            dependency libs.commons.text.get().toString()
            dependency libs.commons.lang3.get().toString()
            dependency libs.commons.beanutils.get().toString()
            dependency libs.commons.validator.get().toString()
            dependency libs.guava.get().toString()
            dependency libs.gson.get().toString()

            // DB related
            dependency libs.postgresql.get().toString()

            dependency libs.eclipselink.core.get().toString()
            dependency libs.eclipselink.jpa.get().toString()

            dependency libs.owasp.encoder.get().toString()

            // Specific versioned dependencies is necessary at the moment
            dependency libs.poi.ooxml.get().toString()
            dependency libs.xml.apis.get().toString()
            // jmzML needs the javax.xml.bind JAXB 2.3 runtime, not the JAXB 4 of the Spring Boot BOM (see libs.versions.toml)
            dependency libs.jaxb.runtime.get().toString()
        }
    }

    dependencies {
        testImplementation libs.spring.boot.starter.test
        testRuntimeOnly libs.junit.platform.launcher
    }

    configurations {
        // cpdetector (via jmzml) requires the SpringSource bundle of ANTLR 2.7.7, which was only
        // available from repo.spring.io; use the identical artifact from Maven Central instead
        configureEach {
            resolutionStrategy.dependencySubstitution {
                substitute module("org.antlr:com.springsource.antlr") using module("antlr:antlr:2.7.7")
                // log4j 1.x (end of life, known vulnerabilities; used by CDK 2.0, MetFragLib and jnati): Apache's
                // replacement with the same API, logging via Log4j 2 to Logback
                substitute module("log4j:log4j") using module("org.apache.logging.log4j:log4j-1.2-api:${libs.versions.log4j2.get()}")
            }
            // jmzml brings the old Codehaus Woodstox 4 (StAX parser); the maintained com.fasterxml.woodstox
            // (via jackson-dataformat-xml) implements the same StAX API
            exclude group: "org.codehaus.woodstox", module: "woodstox-core-asl"
            // Old libraries with known vulnerabilities brought by CDK 2.0, not needed by the functions used
            // (SP-07): Jena (RDF format), Xalan/Xerces (the JDK XML parser is used instead)
            exclude group: "org.apache.jena"
            exclude group: "xalan", module: "xalan"
            exclude group: "xerces", module: "xercesImpl"
            // Logging backend is Logback; Log4j 2 API calls (CDK, MetFragLib) are routed to it by log4j-to-slf4j
            exclude group: "org.apache.logging.log4j", module: "log4j-core"
            // JPA provider is EclipseLink (SP-10); the Spring Boot JPA starter would bring Hibernate along
            exclude group: "org.hibernate.orm"
        }
        // Formerly excluded from "runtime", which all runtime and test runtime classpaths extended
        [runtimeClasspath, testRuntimeClasspath].each {
            it.exclude group: "org.slf4j", module: "slf4j-log4j12"
            it.exclude group: "org.eclipse.jetty", module: "jetty-server"
            it.exclude group: "org.eclipse.jetty", module: "jetty-webapp"
        }
    }
}
